name: ione-edns

# Start everything with `docker compose up -d --build`:
#   API and dashboard  http://localhost:8000 (sign in as test@example.com / password)
#   Reverb WebSocket   ws://localhost:8080
#   Jaeger traces      http://localhost:16686
# Run the test suite with `docker compose --profile test run --rm tests`.
#
# Host ports can be changed with APP_PORT, REVERB_HOST_PORT and JAEGER_UI_PORT.
# Deliveries go to the local mock provider unless
# NOTIFICATIONS_GATEWAY_URL (for example a webhook.site URL) is set in the shell
# or in a local .env file.

# OpenTelemetry settings shared by every PHP service.
# They must be real environment variables: the SDK boots during Composer autoload, before Laravel reads .env.
x-otel-env: &otel-env
    OTEL_PHP_AUTOLOAD_ENABLED: 'true'
    OTEL_SERVICE_NAME: ione-edns
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_PROPAGATORS: tracecontext,baggage

# Settings shared by every PHP service. APP_KEY and REVERB_APP_SECRET are not
# here: the init service creates them in the "secrets" volume on the first start.
x-app-env: &app-env
    <<: *otel-env
    APP_NAME: EDNS
    APP_ENV: local
    APP_DEBUG: 'false'
    APP_URL: http://localhost:${APP_PORT:-8000}
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_DATABASE: ione_edns
    DB_USERNAME: ione_edns
    DB_PASSWORD: secret
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: database
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: edns-local
    REVERB_APP_KEY: edns-local-key
    REVERB_HOST: reverb
    REVERB_PORT: '8080'
    REVERB_SCHEME: http
    NOTIFICATIONS_GATEWAY_URL: ${NOTIFICATIONS_GATEWAY_URL:-http://provider/}

# The build every PHP service shares; the browser reaches Reverb on the host port.
x-app-build: &app-build
    context: .
    target: app
    args:
        VITE_REVERB_APP_KEY: edns-local-key
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: ${REVERB_HOST_PORT:-8080}
        VITE_REVERB_SCHEME: http

x-app: &app
    image: ione-edns-app
    build: *app-build
    environment: *app-env
    volumes:
        - secrets:/var/www/secrets:ro
    depends_on:
        init:
            condition: service_completed_successfully
    restart: unless-stopped

services:
    # Creates the secrets on the first start, migrates and seeds; the other PHP services wait for it.
    init:
        <<: *app
        command: ['init.sh']
        volumes:
            - secrets:/var/www/secrets
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: 'no'

    # php-fpm behind nginx.
    app:
        <<: *app

    web:
        image: ione-edns-web
        build:
            <<: *app-build
            target: web
        ports:
            - '${APP_PORT:-8000}:80'
        depends_on:
            - app
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/up']
            interval: 10s
            timeout: 5s
            retries: 6
        restart: unless-stopped

    # Queue workers for the notification and broadcast queues.
    # The image stops with SIGQUIT, php-fpm's graceful stop; Horizon only listens for
    # SIGTERM, then lets running jobs finish before it exits.
    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        stop_signal: SIGTERM
        stop_grace_period: 30s
        depends_on:
            init:
                condition: service_completed_successfully
            provider:
                condition: service_started

    # Sweeps, scheduled notifications and the 5-second metrics broadcast.
    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']

    # Reverb, too, closes its connections gracefully only on SIGTERM.
    reverb:
        <<: *app
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        stop_signal: SIGTERM
        ports:
            - '${REVERB_HOST_PORT:-8080}:8080'
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);',
                ]
            interval: 10s
            timeout: 5s
            retries: 6

    postgres:
        image: postgres:18.7-alpine
        environment:
            POSTGRES_DB: ione_edns
            POSTGRES_USER: ione_edns
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres:/var/lib/postgresql
            - ./docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/create-testing-database.sql:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-h',
                    '127.0.0.1',
                    '-U',
                    'ione_edns',
                    '-d',
                    'ione_edns',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    # Append-only persistence keeps queued and delayed jobs across restarts.
    redis:
        image: redis:8.10.3-alpine
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    # A stand-in for the webhook.site provider, used while NOTIFICATIONS_GATEWAY_URL
    # is not set: it accepts every delivery with 202 and a fresh messageId.
    provider:
        image: nginx:1.30.6-alpine
        volumes:
            - ./docker/mock-provider/default.conf:/etc/nginx/conf.d/default.conf:ro
        restart: unless-stopped

    # Tracing backend: receives OTLP from the PHP services and serves the trace UI.
    # Traces are kept in memory and are lost when the container restarts.
    jaeger:
        image: jaegertracing/jaeger:2.23.0
        ports:
            - '${JAEGER_UI_PORT:-16686}:16686'
        restart: unless-stopped

    # The test suite against its own database: docker compose --profile test run --rm tests
    tests:
        image: ione-edns-tests
        build:
            context: .
            target: tests
        profiles: ['test']
        environment:
            DB_HOST: postgres
            DB_PORT: '5432'
            DB_DATABASE: ione_edns_testing
            DB_USERNAME: ione_edns
            DB_PASSWORD: secret
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: '6379'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    postgres:
    redis:
    secrets:
