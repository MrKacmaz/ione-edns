# Serves the public directory and hands PHP requests to php-fpm in the app service.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    # Batches of 1000 notifications stay well below this, but keep large API bodies in memory.
    client_body_buffer_size 1m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Docker's DNS, read again every few seconds: a recreated app container gets a new
    # address, and a host name written directly in fastcgi_pass is resolved only at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;

    location ~ \.php$ {
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
