# A stand-in for the webhook.site provider (the provider service in docker-compose.yml).
# Every request is accepted the way the real provider answers it,
# with a fresh messageId each time.
server {
    listen 80;
    default_type application/json;

    location / {
        return 202 '{"messageId":"$request_id","status":"accepted","timestamp":"$time_iso8601"}';
    }
}
