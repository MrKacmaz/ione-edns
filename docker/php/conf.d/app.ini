; Runtime settings for the app image. The code is baked into the image, so
; OPcache never needs to check files for changes.

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

[php]
expose_php=Off
memory_limit=256M
