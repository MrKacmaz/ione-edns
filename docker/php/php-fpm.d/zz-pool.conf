; The php-fpm pool of the app service. The image's default of five workers would
; queue API requests behind each other under load. Each worker takes about
; 30-60 MB, so twenty fit comfortably next to the queue workers.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Restart a worker now and then, so a slow leak never builds up.
pm.max_requests = 1000
