$kind: http-request
description: The template and the variables a notification created from it must give a value to.
url: "{{baseUrl}}/v1/templates/:template"
method: GET
headers:
  - key: X-Correlation-ID
    value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
    disabled: false
    description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
  - key: Accept
    value: application/json
pathVariables:
  - key: template
    value: 518102bb-bd42-5117-df09-cd2519ea1e97
    disabled: false
    description: (Required) The template ID
settings: {}
examples: ./.resources/Get a template.resources/examples
order: 3000
