$kind: http-example
request:
  url: "{{baseUrl}}/v1/templates"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "order-shipped",
        "channel": "sms",
        "content": "Hi {{ name }}, your order {{ order_id }} has shipped."
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "errors": {
          "key_0": [
            "string",
            "string"
          ],
          "key_1": [
            "string",
            "string"
          ],
          "key_2": [
            "string",
            "string"
          ]
        }
      }
order: 3000
