$kind: http-example
request:
  url: "{{baseUrl}}/v1/templates"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "order-shipped",
        "channel": "sms",
        "content": "Hi {{ name }}, your order {{ order_id }} has shipped."
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "string",
          "name": "string",
          "channel": "email",
          "content": "string",
          "variables": [
            "string",
            "string"
          ],
          "created_at": "1990-01-19T05:46:07.666Z",
          "updated_at": "1985-10-19T19:27:38.288Z"
        }
      }
order: 1000
