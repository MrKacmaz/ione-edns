$kind: http-example
request:
  url: "{{baseUrl}}/v1/user"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 7047,
        "name": "string",
        "email": "string",
        "email_verified_at": "1971-04-02T04:12:06.691Z",
        "created_at": "1980-03-01T20:52:59.193Z",
        "updated_at": "1976-01-16T13:11:55.118Z",
        "deleted_at": "2005-08-12T20:55:22.141Z",
        "is_operator": true
      }
order: 1000
