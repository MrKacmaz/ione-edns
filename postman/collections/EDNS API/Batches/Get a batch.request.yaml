$kind: http-request
description: How many of the batch's notifications are in each status, and whether all of them are finished.
url: "{{baseUrl}}/v1/batches/:batch"
method: GET
headers:
  - key: X-Correlation-ID
    value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
    disabled: false
    description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
  - key: Accept
    value: application/json
pathVariables:
  - key: batch
    value: a0640c13-c986-67fc-ba2f-1bd373520750
    disabled: false
    description: (Required) The batch ID
settings: {}
examples: ./.resources/Get a batch.resources/examples
order: 2000
