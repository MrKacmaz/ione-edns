$kind: http-example
request:
  url: "{{baseUrl}}/v1/notifications/batch"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Idempotency-Key
      value: 8d3f1c7e-2b4a-4f0e-9c61-5a7b2e9d1f30
      disabled: false
      description: "Makes a retried request safe: a repeat with the same key and payload within 24 hours replays the first response instead of creating notifications again. A different payload with the same key answers 422."
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "notifications": [
          {
            "channel": "sms",
            "recipient": "string",
            "content": "string",
            "template": "string",
            "variables": {
              "key_0": "string",
              "key_1": "string",
              "key_2": "string",
              "key_3": "string"
            },
            "priority": "high",
            "idempotency_key": "string",
            "scheduled_at": "2011-11-19T23:55:22.144Z"
          }
        ]
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    - key: Idempotent-Replayed
      value: string
      disabled: false
      description: Present with the value "true" when the response is a replay of an earlier request with the same Idempotency-Key.
    - key: Content-Type
      value: application/json
