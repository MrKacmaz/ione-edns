$kind: http-example
request:
  url: "{{baseUrl}}/v1/batches/:batch/cancel"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  pathVariables:
    - key: batch
      value: 518102bb-bd42-5117-df09-cd2519ea1e97
      disabled: false
      description: (Required) The batch ID
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "string",
          "total": 3103.046319447458,
          "status_counts": {
            "key_0": 3301,
            "key_1": 4863
          },
          "is_finished": true,
          "created_at": "1999-02-07T04:07:32.304Z"
        },
        "meta": {
          "cancelled": 3975
        }
      }
order: 1000
