$kind: http-request
description: |-
  Cancelling a notification that is already cancelled succeeds again and
  returns it unchanged, so a client may safely repeat the request. Responds
  with 409 when the notification is already processing, sent or failed.
url: "{{baseUrl}}/v1/notifications/:notification/cancel"
method: POST
headers:
  - key: X-Correlation-ID
    value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
    disabled: false
    description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
  - key: Accept
    value: application/json
pathVariables:
  - key: notification
    value: a0640c13-c986-67fc-ba2f-1bd373520750
    disabled: false
    description: (Required) The notification ID
settings: {}
examples: ./.resources/Cancel a notification.resources/examples
order: 4000
