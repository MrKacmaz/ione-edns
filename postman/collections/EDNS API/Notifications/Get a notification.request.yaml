$kind: http-request
description: The notification and its delivery status. Another user's notification answers 404.
url: "{{baseUrl}}/v1/notifications/:notification"
method: GET
headers:
  - key: X-Correlation-ID
    value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
    disabled: false
    description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
  - key: Accept
    value: application/json
pathVariables:
  - key: notification
    value: 439adaa5-b05f-32da-595c-ca918fb857a4
    disabled: false
    description: (Required) The notification ID
settings: {}
examples: ./.resources/Get a notification.resources/examples
order: 3000
