$kind: http-example
request:
  url: "{{baseUrl}}/v1/notifications"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Idempotency-Key
      value: 8d3f1c7e-2b4a-4f0e-9c61-5a7b2e9d1f30
      disabled: false
      description: "Makes a retried request safe: a repeat with the same key and payload within 24 hours replays the first response instead of creating notifications again. A different payload with the same key answers 422."
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "channel": "sms",
        "recipient": "+905551234567",
        "content": "Your order has shipped.",
        "priority": "high"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "string",
          "batch_id": "string",
          "template_id": "string",
          "channel": "sms",
          "priority": "low",
          "status": "processing",
          "recipient": "string",
          "content": "string",
          "idempotency_key": "string",
          "correlation_id": "string",
          "attempts": 7875,
          "provider_message_id": "string",
          "last_error": "string",
          "scheduled_at": "2000-01-08T17:11:37.725Z",
          "queued_at": "1947-03-03T10:51:11.710Z",
          "sent_at": "1947-09-08T16:01:29.718Z",
          "failed_at": "1949-12-17T06:24:53.529Z",
          "cancelled_at": "2015-07-18T06:17:37.990Z",
          "created_at": "1983-08-24T10:04:58.419Z",
          "updated_at": "2011-11-07T20:39:19.823Z"
        }
      }
order: 1000
