$kind: http-example
request:
  url: "{{baseUrl}}/v1/notifications"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Idempotency-Key
      value: 8d3f1c7e-2b4a-4f0e-9c61-5a7b2e9d1f30
      disabled: false
      description: "Makes a retried request safe: a repeat with the same key and payload within 24 hours replays the first response instead of creating notifications again. A different payload with the same key answers 422."
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "channel": "sms",
        "recipient": "+905551234567",
        "content": "Your order has shipped.",
        "priority": "high"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "string",
          "batch_id": "string",
          "template_id": "string",
          "channel": "email",
          "priority": "low",
          "status": "waiting",
          "recipient": "string",
          "content": "string",
          "idempotency_key": "string",
          "correlation_id": "string",
          "attempts": 1689,
          "provider_message_id": "string",
          "last_error": "string",
          "scheduled_at": "2004-10-17T11:56:14.093Z",
          "queued_at": "2022-02-22T00:23:34.692Z",
          "sent_at": "1989-09-25T13:38:21.313Z",
          "failed_at": "1996-12-22T13:39:55.592Z",
          "cancelled_at": "1950-04-19T06:28:58.189Z",
          "created_at": "1991-01-26T12:24:57.773Z",
          "updated_at": "1959-05-02T13:25:10.556Z"
        }
      }
order: 1000
