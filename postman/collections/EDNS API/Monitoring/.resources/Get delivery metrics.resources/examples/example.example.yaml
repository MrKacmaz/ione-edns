$kind: http-example
name: ""
request:
  url: "{{baseUrl}}/v1/metrics?format=json"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: X-Correlation-ID
      value: 0b9e8c1a-4d2f-4e7b-8a3c-6f1d2e9b7a54
      disabled: false
      description: A UUID that ties the request to its log entries, jobs and provider calls. It is echoed in the response; a new one is created when it is missing or not a UUID.
    - key: Accept
      value: application/json
  queryParams:
    format: json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "generated_at": "string",
          "notifications_in_flight": {
            "key_0": 5850,
            "key_1": 1467,
            "key_2": 8962,
            "key_3": 6035,
            "key_4": 5518
          },
          "circuits": {
            "key_0": "string",
            "key_1": "string"
          }
        }
      }
order: 1000
