$kind: http-request
description: "Runs only against the mock provider (mockProvider = true): the [fail:400] marker makes it answer 400, a permanent failure."
url: "{{baseUrl}}/v1/notifications"
method: POST
headers:
  - key: "Accept"
    value: "application/json"
  - key: "Content-Type"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "channel": "sms",
      "recipient": "+905551234567",
      "content": "EDNS smoke flow: rejected by the provider [fail:400]",
      "priority": "high"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (pm.environment.get('mockProvider') !== 'true') {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('answers 202', () => pm.response.to.have.status(202));
      pm.collectionVariables.set('rejectedNotificationId', pm.response.json().data.id);
      pm.collectionVariables.set('rejectionPolls', 0);
    language: text/javascript
order: 15200
