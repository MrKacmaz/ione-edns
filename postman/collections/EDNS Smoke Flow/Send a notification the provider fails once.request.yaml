$kind: http-request
description: "Runs only against the mock provider (mockProvider = true): the [fail:503*1] marker makes it answer 503 to the first attempt and accept the retry."
url: "{{baseUrl}}/v1/notifications"
method: POST
headers:
  - key: "Accept"
    value: "application/json"
  - key: "Content-Type"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "channel": "push",
      "recipient": "smoke-flow-device-token-0123456789",
      "content": "EDNS smoke flow: sent on the second attempt [fail:503*1]",
      "priority": "high"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (pm.environment.get('mockProvider') !== 'true') {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('answers 202', () => pm.response.to.have.status(202));
      pm.collectionVariables.set('retriedNotificationId', pm.response.json().data.id);
      pm.collectionVariables.set('retryPolls', 0);
    language: text/javascript
order: 15400
