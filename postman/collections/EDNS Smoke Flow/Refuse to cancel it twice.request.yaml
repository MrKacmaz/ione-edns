$kind: http-request
url: "{{baseUrl}}/v1/notifications/{{notificationId}}/cancel"
method: POST
headers:
  - key: "Accept"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('answers 409 with the reason', () => {
          pm.response.to.have.status(409);
          pm.expect(pm.response.json().message).to.equal('The notification can no longer be cancelled because it is cancelled.');
      });
    language: text/javascript
order: 9000
