$kind: http-request
url: "{{baseUrl}}/v1/templates/{{templateId}}"
method: DELETE
headers:
  - key: "Accept"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('answers 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 18000
