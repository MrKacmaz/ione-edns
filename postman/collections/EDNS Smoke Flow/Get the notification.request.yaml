$kind: http-request
url: "{{baseUrl}}/v1/notifications/{{notificationId}}"
method: GET
headers:
  - key: "Accept"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('answers 200 with the scheduled notification', () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().data.status).to.equal('scheduled');
      });
    language: text/javascript
order: 6000
