$kind: http-request
url: "{{baseUrl}}/v1/templates"
method: POST
headers:
  - key: "Accept"
    value: "application/json"
  - key: "Content-Type"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "name": "{{templateName}}",
      "channel": "sms",
      "content": "Hi {{ name }}, your order {{ order_id }} has shipped."
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('templateName', 'smoke-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('answers 201', () => pm.response.to.have.status(201));
      const template = pm.response.json().data;
      pm.test('lists the variables the template needs', () => pm.expect(template.variables).to.eql(['name', 'order_id']));
      pm.collectionVariables.set('templateId', template.id);
    language: text/javascript
order: 3000
