$kind: http-request
url: "{{baseUrl}}/v1/notifications/batch"
method: POST
headers:
  - key: "Accept"
    value: "application/json"
  - key: "Content-Type"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "notifications": [
        {
          "channel": "sms",
          "recipient": "+905551234567",
          "content": "Flash sale tomorrow!",
          "scheduled_at": "{{scheduledAt}}"
        },
        {
          "channel": "email",
          "recipient": "customer@example.com",
          "content": "Your invoice is ready.",
          "priority": "low",
          "scheduled_at": "{{scheduledAt}}"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('answers 202', () => pm.response.to.have.status(202));
      const batch = pm.response.json().data;
      pm.test('holds both notifications', () => {
          pm.expect(batch.total).to.equal(2);
          pm.expect(batch.status_counts.scheduled).to.equal(2);
      });
      pm.collectionVariables.set('batchId', batch.id);
    language: text/javascript
order: 11000
