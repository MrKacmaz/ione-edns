$kind: http-request
url: "{{baseUrl}}/v1/notifications?status=scheduled&per_page=100"
method: GET
headers:
  - key: "Accept"
    value: "application/json"
  - key: "X-Correlation-ID"
    value: "{{$guid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('answers 200', () => pm.response.to.have.status(200));
      pm.test('includes the scheduled notification', () => {
          const ids = pm.response.json().data.map((notification) => notification.id);
          pm.expect(ids).to.include(pm.collectionVariables.get('notificationId'));
      });
    language: text/javascript
order: 7000
