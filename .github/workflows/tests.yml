name: tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ione_edns
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ione_edns_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ione_edns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The rate limiter, circuit breaker and health check tests run their Lua scripts and
      # commands against a real Redis, on the default host and port.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # .env.example ships without database credentials and .env.testing is not committed,
    # so the job points every database connection at the postgres service above.
    env:
      DB_DATABASE: ione_edns_testing
      DB_USERNAME: ione_edns
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
