name: CI

# Quality checks, the test suite and an end-to-end run of the Docker stack on every
# push and pull request. Pushes to master and v* tags then publish the images to
# GitHub Container Registry; a v* tag also creates a GitHub release.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting (Pint)
        run: vendor/bin/pint --test

      - name: Run static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Also generates the Wayfinder route helpers that the checks below type-check.
      - name: Build the frontend
        run: npm run build

      - name: Check frontend formatting and lint
        run: npm run check

      - name: Check TypeScript types
        run: npm run types:check

      - name: Audit dependencies for known vulnerabilities
        run: |
          composer audit --no-interaction
          npm audit --audit-level=high

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The same versions as docker-compose.yml. The rate limiter, circuit breaker and
    # health check tests run their Lua scripts and commands against a real Redis.
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: ione_edns
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ione_edns_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ione_edns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # .env.example ships without database credentials and .env.testing is not committed,
    # so the job points every database connection at the postgres service above.
    env:
      DB_CONNECTION: pgsql
      DB_DATABASE: ione_edns_testing
      DB_USERNAME: ione_edns
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl
          tools: composer:v2
          coverage: none

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      # Scramble reads column types from the database, so the export needs the migrated schema.
      - name: Check the OpenAPI specification is up to date
        run: |
          php artisan scramble:export --path=spec/openapi.json
          git diff --exit-code -- spec/openapi.json || {
            echo "::error file=spec/openapi.json::The specification is out of date. Run 'php artisan scramble:export --path=spec/openapi.json' and commit the result."
            exit 1
          }

      # A random order catches tests that depend on each other; the output ends with
      # the seed, which reproduces the order with --random-order-seed.
      - name: Run the unit and feature tests in random order
        run: php artisan test --compact --testsuite=Unit,Feature --order-by=random

      # Real processes working together, such as a queue worker on a real Redis queue.
      - name: Run the integration tests
        run: php artisan test --compact --testsuite=Integration

  e2e:
    name: End-to-end (Docker)
    runs-on: ubuntu-latest

    # Without a NOTIFICATIONS_GATEWAY_URL the stack delivers to its mock provider.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: app,web
          load: true
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max

      - name: Start the stack
        run: docker compose up -d --no-build

      # /health answers 200 once the migrations ran and the database, Redis, Horizon
      # and the gateway configuration are all fine.
      - name: Wait until the stack is healthy
        run: |
          timeout 300 bash -c 'until curl -fs http://localhost:8000/health > /dev/null; do sleep 5; done' || {
            curl -s http://localhost:8000/health
            exit 1
          }

      - name: Install the Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh

      # The stack runs with APP_ENV=local, so the seeded demo token from the environment file works.
      - name: Run the smoke flow
        run: |
          postman collection run "postman/collections/EDNS Smoke Flow" \
            --environment "postman/environments/EDNS Local.environment.yaml" \
            --env-var "mockProvider=true"

      # A notification's trace, with its delivery attempt in it, has to reach Jaeger.
      - name: Check that a notification's trace reaches Jaeger
        run: |
          trace_id=$(curl -fsS -X POST http://localhost:8000/api/v1/notifications \
            -H 'Authorization: Bearer edns-demo-token' -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"recipient": "+905551234567", "channel": "sms", "content": "CI trace check"}' | jq -r '.data.trace_id')
          if [ -z "$trace_id" ] || [ "$trace_id" = null ]; then
            echo "The notification has no trace id." && exit 1
          fi
          for attempt in $(seq 1 30); do
            spans=$(curl -sS "http://localhost:16686/api/v3/traces/$trace_id" | jq -r '[.result.resourceSpans[]?.scopeSpans[]?.spans[]?.name] | join(" ")' 2>/dev/null || true)
            case " $spans " in
              *" notification.deliver "*) echo "Trace $trace_id reached Jaeger: $spans" && exit 0 ;;
            esac
            sleep 2
          done
          echo "The trace $trace_id did not reach Jaeger with its delivery attempt; spans: $spans"
          exit 1

      - name: Collect the service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose.log

      - name: Upload the service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

  publish:
    name: Publish
    needs: [quality, tests, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build as the end-to-end job, served from its cache. The source label
      # links the packages to this repository.
      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: app,web
          load: true
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            app.cache-from=type=gha,scope=app
            web.cache-from=type=gha,scope=web

      # master is published as latest, a v1.2.3 tag as 1.2.3; every image also gets sha-<commit>.
      - name: Push the images
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tags=("sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=("${GITHUB_REF_NAME#v}")
          else
            tags+=(latest)
          fi
          for image in ione-edns-app ione-edns-web; do
            for tag in "${tags[@]}"; do
              docker tag "$image" "$registry/$image:$tag"
              docker push "$registry/$image:$tag"
            done
          done

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
